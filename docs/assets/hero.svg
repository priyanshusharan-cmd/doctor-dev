<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="1200" height="420" role="img" aria-labelledby="title desc">
  <title id="title">Doctor Dev</title>
  <desc id="desc">Animated banner: Doctor Dev finds what will break before your developers do. A heartbeat line scans across the repository.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070b14"/>
      <stop offset="0.55" stop-color="#0c1428"/>
      <stop offset="1" stop-color="#140b2a"/>
    </linearGradient>
    <linearGradient id="titleGrad" x1="0" y1="0" x2="1200" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#60a5fa"/>
      <stop offset="0.35" stop-color="#a78bfa"/>
      <stop offset="0.7" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#60a5fa"/>
      <animateTransform attributeName="gradientTransform" type="translate" values="-600 0;600 0;-600 0" dur="9s" repeatCount="indefinite"/>
    </linearGradient>
    <linearGradient id="pulseGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0"/>
      <stop offset="0.25" stop-color="#22d3ee"/>
      <stop offset="0.75" stop-color="#a78bfa"/>
      <stop offset="1" stop-color="#f472b6" stop-opacity="0.2"/>
    </linearGradient>
    <radialGradient id="orbBlue" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#3b82f6" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#3b82f6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="orbViolet" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#8b5cf6" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#1e293b" stroke-width="1" opacity="0.55"/>
    </pattern>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="card"><rect width="1200" height="420" rx="28"/></clipPath>
    <style>
      .t { font-family: Inter, 'Segoe UI', -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif; }
      .m { font-family: 'JetBrains Mono', SFMono-Regular, Menlo, Consolas, monospace; }
      .fade { opacity: 0; animation: fade 0.9s ease-out forwards; }
      .d1 { animation-delay: 0.2s; } .d2 { animation-delay: 0.6s; } .d3 { animation-delay: 1.0s; }
      .d4 { animation-delay: 1.3s; } .d5 { animation-delay: 1.6s; } .d6 { animation-delay: 1.9s; }
      @keyframes fade { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
      .ecg { stroke-dasharray: 1400; stroke-dashoffset: 1400; animation: draw 3.6s cubic-bezier(.6,.1,.3,1) infinite; }
      @keyframes draw { 0% { stroke-dashoffset: 1400; } 60% { stroke-dashoffset: 0; } 100% { stroke-dashoffset: -1400; } }
      .beat { transform-origin: 186px 196px; animation: beat 1.2s ease-in-out infinite; }
      @keyframes beat { 0%,100% { transform: scale(1); } 15% { transform: scale(1.08); } 30% { transform: scale(0.98); } 45% { transform: scale(1.05); } }
      .ring { transform-origin: 186px 196px; animation: ring 2.4s ease-out infinite; }
      @keyframes ring { from { transform: scale(0.85); opacity: 0.7; } to { transform: scale(1.6); opacity: 0; } }
      .blink { animation: blink 1s steps(1) infinite; }
      @keyframes blink { 50% { opacity: 0; } }
      @media (prefers-reduced-motion: reduce) {
        .fade, .ecg, .beat, .ring, .blink { animation: none; opacity: 1; stroke-dashoffset: 0; }
      }
    </style>
  </defs>

  <g clip-path="url(#card)">
    <rect width="1200" height="420" fill="url(#bg)"/>
    <rect width="1200" height="420" fill="url(#grid)"/>

    <circle r="220" fill="url(#orbBlue)">
      <animate attributeName="cx" values="160;300;160" dur="14s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="60;140;60" dur="14s" repeatCount="indefinite"/>
    </circle>
    <circle r="260" fill="url(#orbViolet)">
      <animate attributeName="cx" values="1050;880;1050" dur="16s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="380;280;380" dur="16s" repeatCount="indefinite"/>
    </circle>

    <!-- Shield mark with a heartbeat -->
    <g>
      <circle class="ring" cx="186" cy="196" r="92" fill="none" stroke="#3b82f6" stroke-width="2"/>
      <circle class="ring" cx="186" cy="196" r="92" fill="none" stroke="#a78bfa" stroke-width="2" style="animation-delay:1.2s"/>
      <g class="beat">
        <path d="M186 104 L262 134 V196 C262 246 228 280 186 296 C144 280 110 246 110 196 V134 Z"
              fill="#0b1324" stroke="url(#titleGrad)" stroke-width="5" stroke-linejoin="round" filter="url(#glow)"/>
        <polyline points="128,200 158,200 170,176 184,226 198,160 212,212 222,200 246,200"
                  fill="none" stroke="#22d3ee" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>
      </g>
    </g>

    <!-- Wordmark -->
    <text class="t fade d1" x="330" y="168" font-size="86" font-weight="900" letter-spacing="-2" fill="url(#titleGrad)">Doctor Dev</text>
    <text class="t fade d2" x="334" y="222" font-size="30" font-weight="600" fill="#e2e8f0">Find what will break before your developers do.</text>
    <text class="m fade d3" x="334" y="264" font-size="17" fill="#94a3b8">$ doctor-dev analyze ./your-repo<tspan class="blink" fill="#22d3ee">▍</tspan></text>

    <!-- Capability chips -->
    <g class="t" font-size="16" font-weight="700">
      <g class="fade d4">
        <rect x="334" y="292" width="150" height="38" rx="19" fill="#1e1b4b" stroke="#8b5cf6" stroke-opacity="0.7"/>
        <circle cx="356" cy="311" r="5" fill="#a78bfa"/>
        <text x="370" y="317" fill="#ddd6fe">TestPilot</text>
      </g>
      <g class="fade d5">
        <rect x="498" y="292" width="180" height="38" rx="19" fill="#082f49" stroke="#22d3ee" stroke-opacity="0.7"/>
        <circle cx="520" cy="311" r="5" fill="#22d3ee"/>
        <text x="534" y="317" fill="#cffafe">ConfigDoctor</text>
      </g>
      <g class="fade d6">
        <rect x="692" y="292" width="196" height="38" rx="19" fill="#052e16" stroke="#22c55e" stroke-opacity="0.7"/>
        <circle cx="714" cy="311" r="5" fill="#4ade80"/>
        <text x="728" y="317" fill="#dcfce7">Health score A–F</text>
      </g>
    </g>

    <!-- Animated grade badge -->
    <g transform="translate(1004 96)"><g class="fade d6">
      <rect width="148" height="176" rx="22" fill="#0b1324" stroke="#334155"/>
      <text class="t" x="74" y="34" text-anchor="middle" font-size="13" font-weight="700" fill="#64748b" letter-spacing="2">HEALTH</text>
      <circle cx="74" cy="96" r="46" fill="none" stroke="#1e293b" stroke-width="10"/>
      <circle cx="74" cy="96" r="46" fill="none" stroke="#22c55e" stroke-width="10" stroke-linecap="round"
              stroke-dasharray="289" stroke-dashoffset="289" transform="rotate(-90 74 96)">
        <animate attributeName="stroke-dashoffset" values="289;40;40;289" keyTimes="0;0.35;0.85;1" dur="6s" repeatCount="indefinite"/>
        <animate attributeName="stroke" values="#ef4444;#eab308;#22c55e;#22c55e;#ef4444" keyTimes="0;0.15;0.35;0.85;1" dur="6s" repeatCount="indefinite"/>
      </circle>
      <text class="t" x="74" y="112" text-anchor="middle" font-size="44" font-weight="900" fill="#f8fafc">
        <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.25;0.35;0.85;1" dur="6s" repeatCount="indefinite"/>A</text>
      <text class="t" x="74" y="162" text-anchor="middle" font-size="13" font-weight="600" fill="#4ade80">
        <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.3;0.4;0.85;1" dur="6s" repeatCount="indefinite"/>healthy</text>
    </g></g>

    <!-- Heartbeat scan line -->
    <path class="ecg" d="M0 372 H300 l18 -34 l22 66 l26 -98 l24 92 l16 -26 H640 l14 -20 l18 40 l14 -20 H1200"
          fill="none" stroke="url(#pulseGrad)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>
    <circle r="6" fill="#e0f2fe" filter="url(#glow)">
      <animateMotion dur="3.6s" repeatCount="indefinite" keyPoints="0;1;1" keyTimes="0;0.6;1" calcMode="linear"
                     path="M0 372 H300 l18 -34 l22 66 l26 -98 l24 92 l16 -26 H640 l14 -20 l18 40 l14 -20 H1200"/>
      <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.6;0.62;1" dur="3.6s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
